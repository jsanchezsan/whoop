  <!-- Cuerpo -->
  <circle cx="400" cy="300" r="190" fill="#b8b8b8"/>
  <circle cx="400" cy="300" r="170" fill="#d9d9d9"/>
  <circle cx="400" cy="300" r="150" fill="#fbf8f0" stroke="#7a7a7a" stroke-width="3"/>

  <!-- Marcas de la esfera -->
  <g stroke="#333333" stroke-width="4">
    <line x1="400" y1="160" x2="400" y2="182"/>
    <line x1="540" y1="300" x2="518" y2="300"/>
    <line x1="400" y1="440" x2="400" y2="418"/>
    <line x1="260" y1="300" x2="282" y2="300"/>
    <line x1="499" y1="201" x2="483" y2="217"/>
    <line x1="499" y1="399" x2="483" y2="383"/>
    <line x1="301" y1="399" x2="317" y2="383"/>
