  </g>
  <text x="400" y="210" fill="#333333" font-size="22" font-weight="bold" text-anchor="middle">0</text>
  <text x="495" y="308" fill="#333333" font-size="22" font-weight="bold" text-anchor="middle">5</text>
  <text x="400" y="404" fill="#333333" font-size="22" font-weight="bold" text-anchor="middle">10</text>
  <text x="305" y="308" fill="#333333" font-size="22" font-weight="bold" text-anchor="middle">15</text>
  <text x="400" y="258" fill="#a33" font-size="16" text-anchor="middle">×1000 PASOS</text>

  <!-- Aguja -->
  <line x1="400" y1="300" x2="470" y2="355" stroke="#b22222" stroke-width="6" stroke-linecap="round"/>
  <circle cx="400" cy="300" r="12" fill="#333333"/>

  <!-- Brillo del cristal -->
