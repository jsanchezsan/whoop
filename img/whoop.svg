<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <radialGradient id="luz" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#1f3a2c"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </radialGradient>
    <linearGradient id="tela" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3038"/>
      <stop offset="0.5" stop-color="#171b21"/>
      <stop offset="1" stop-color="#22272e"/>
    </linearGradient>
    <linearGradient id="sensor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a414b"/>
      <stop offset="1" stop-color="#14181d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#luz)"/>

  <!-- Correa -->
  <path d="M40 250 Q400 200 760 250 L760 360 Q400 310 40 360 Z" fill="url(#tela)"/>
  <!-- Textura de tela -->
  <path d="M40 268 Q400 218 760 268" fill="none" stroke="#323943" stroke-width="2"/>
  <path d="M40 286 Q400 236 760 286" fill="none" stroke="#323943" stroke-width="2"/>
  <path d="M40 304 Q400 254 760 304" fill="none" stroke="#323943" stroke-width="2"/>
  <path d="M40 322 Q400 272 760 322" fill="none" stroke="#323943" stroke-width="2"/>
  <path d="M40 340 Q400 290 760 340" fill="none" stroke="#323943" stroke-width="2"/>

  <!-- Sensor -->
  <rect x="285" y="185" width="230" height="170" rx="40" fill="url(#sensor)" stroke="#4a5360" stroke-width="3"/>
  <rect x="305" y="205" width="190" height="130" rx="30" fill="none" stroke="#2a3038" stroke-width="2"/>
  <text x="400" y="282" fill="#e9edf2" font-size="40" font-weight="bold" text-anchor="middle" letter-spacing="6">WHOOP</text>

  <!-- Brillo verde de los LED -->
  <ellipse cx="400" cy="400" rx="150" ry="18" fill="#2fd27a" opacity="0.18"/>
  <circle cx="370" cy="398" r="6" fill="#2fd27a"/>
  <circle cx="400" cy="398" r="6" fill="#2fd27a"/>
  <circle cx="430" cy="398" r="6" fill="#2fd27a"/>
</svg>
